<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <title>Meine Bildergallerie</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Meine Bildergallerie</h1>

        <div class="buttons">
            <button class="filter-btn" data-category="alle">Alle</button>
            <button class="filter-btn" data-category="amsterdam">Amsterdam</button>
            <button class="filter-btn" data-category="deutschland">Deutschland</button>
            <button class="filter-btn">+</button>
        </div>
        
        <div class="gallery">
            <img src="amsterdam/1am.jpg" data-category="amsterdam">
            <img src="deutschland/1de.webp" data-category="deutschland">
            <img src="amsterdam/2am.jpg" data-category="amsterdam">
            <img src="deutschland/2de.webp" data-category="deutschland">
            <img src="amsterdam/3am.jpg" data-category="amsterdam">
            <img src="deutschland/3de.webp" data-category="deutschland">
            <img src="amsterdam/4am.jpeg" data-category="amsterdam">
            <img src="deutschland/4de.jpg" data-category="deutschland">
            <img src="amsterdam/5am.webp" data-category="amsterdam">
            <img src="deutschland/5de.jpg" data-category="deutschland">
            <img src="amsterdam/6am.jpg" data-category="amsterdam">
            <img src="deutschland/6de.jpg" data-category="deutschland">
        </div>

    </body>
    <script src="script.js"></script>
</html>
